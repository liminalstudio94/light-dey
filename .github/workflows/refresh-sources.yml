name: Refresh electricity sources
# Vercel Hobby crons run at most daily, so this schedules the 10-minute refresh.
# Needs repo secrets LIGHTDEY_URL (e.g. https://light-dey-pink.vercel.app) and CRON_SECRET.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: refresh-sources
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call refresh endpoint
        env:
          URL: ${{ secrets.LIGHTDEY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o out.json -w '%{http_code}' --max-time 90 --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer ${CRON_SECRET}" "${URL}/api/cron/refresh")
          jq -c '{at, runs: [.runs[] | {sourceId, status, itemsWritten, error}], snapshots, mapCounts}' out.json || cat out.json
          test "$code" = "200"
