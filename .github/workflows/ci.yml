name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit, integration & security tests
        run: npm test
      - name: Seed files in sync with code
        run: npm run gen:seed && git diff --exit-code supabase/migrations
      - name: Build
        run: npm run build
        env:
          LIGHTDEY_ALLOW_MEMORY_STORE: "1"
